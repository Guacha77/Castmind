name: Castmind
options:
  bundleIdPrefix: dev.castmind
  deploymentTarget:
    iOS: "18.0"
  xcodeVersion: "26.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
packages:
  MLXSwiftLM:
    url: https://github.com/ml-explore/mlx-swift-lm
    exactVersion: 3.31.4
  SwiftHuggingFace:
    url: https://github.com/huggingface/swift-huggingface
    exactVersion: 0.9.0
  SwiftTransformers:
    url: https://github.com/huggingface/swift-transformers
    exactVersion: 1.3.0
targets:
  Castmind:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: Castmind
        excludes:
          - Resources/Info.plist
          - Resources/PrivacyInfo.xcprivacy
          - Resources/Assets.xcassets
    resources:
      - path: Castmind/Resources/Assets.xcassets
      - path: Castmind/Resources/PrivacyInfo.xcprivacy
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.castmind.localai
        PRODUCT_NAME: Castmind
        MARKETING_VERSION: "3.1.0"
        CURRENT_PROJECT_VERSION: "310"
        INFOPLIST_FILE: Castmind/Resources/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
    dependencies:
      - package: MLXSwiftLM
        product: MLXLLM
      - package: MLXSwiftLM
        product: MLXLMCommon
      - package: MLXSwiftLM
        product: MLXHuggingFace
      - package: SwiftHuggingFace
        product: HuggingFace
      - package: SwiftTransformers
        product: Tokenizers
    scheme:
      testTargets: []
