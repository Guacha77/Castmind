name: Build Castmind V3.2.0 Stability unsigned IPA

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'Castmind/**'
      - 'project.yml'
      - '.github/workflows/build-unsigned-ipa.yml'

permissions:
  contents: read

jobs:
  build:
    name: Build Release app for iPhone
    runs-on: macos-26
    timeout-minutes: 45
    env:
      DERIVED_DATA: build/DerivedData
      SOURCE_PACKAGES: SourcePackages

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Show toolchain
        run: |
          set -euxo pipefail
          sw_vers
          xcodebuild -version
          swift --version

      - name: Install XcodeGen
        run: |
          set -euxo pipefail
          brew install xcodegen
          xcodegen --version

      - name: Generate Xcode project
        run: |
          set -euxo pipefail
          xcodegen generate --spec project.yml
          test -d Castmind.xcodeproj
          xcodebuild -list -project Castmind.xcodeproj

      - name: Validate generated build settings
        shell: bash
        run: |
          set -euxo pipefail
          plutil -lint Castmind/Resources/Info.plist
          /usr/libexec/PlistBuddy -c 'Print :UILaunchScreen:UIColorName' Castmind/Resources/Info.plist | grep -qx 'LaunchBackground'
          /usr/libexec/PlistBuddy -c 'Print :UIRequiresFullScreen' Castmind/Resources/Info.plist | grep -qx 'true'
          if /usr/libexec/PlistBuddy -c 'Print :UILaunchStoryboardName' Castmind/Resources/Info.plist >/dev/null 2>&1; then
            echo 'Legacy UILaunchStoryboardName must not be present.' >&2
            exit 1
          fi
          xcodebuild -showBuildSettings -project Castmind.xcodeproj -scheme Castmind -configuration Release > build-settings.log
          cat build-settings.log
          grep -E '^[[:space:]]*MARKETING_VERSION = 3\.2\.0$' build-settings.log
          grep -E '^[[:space:]]*CURRENT_PROJECT_VERSION = 320$' build-settings.log
          grep -E '^[[:space:]]*INFOPLIST_FILE = Castmind/Resources/Info\.plist$' build-settings.log
          grep -E '^[[:space:]]*GENERATE_INFOPLIST_FILE = NO$' build-settings.log
          grep -E '^[[:space:]]*TARGETED_DEVICE_FAMILY = 1$' build-settings.log

      - name: Resolve Swift packages
        run: |
          set -o pipefail
          xcodebuild -resolvePackageDependencies \
            -project Castmind.xcodeproj \
            -scheme Castmind \
            -clonedSourcePackagesDirPath "$SOURCE_PACKAGES" \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            | tee build-resolve.log

      - name: Build Release app for iPhone
        run: |
          set -o pipefail
          xcodebuild build \
            -project Castmind.xcodeproj \
            -scheme Castmind \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$DERIVED_DATA" \
            -clonedSourcePackagesDirPath "$SOURCE_PACKAGES" \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            DEVELOPMENT_TEAM='' \
            ONLY_ACTIVE_ARCH=NO \
            | tee build-xcode.log

      - name: Locate and validate app bundle
        id: bundle
        shell: bash
        run: |
          set -euxo pipefail
          APP_PATH="$(find "$DERIVED_DATA/Build/Products/Release-iphoneos" -maxdepth 1 -type d -name 'Castmind.app' -print -quit)"
          test -n "$APP_PATH"
          test -d "$APP_PATH"
          test -f "$APP_PATH/Info.plist"
          plutil -lint "$APP_PATH/Info.plist"
          plutil -p "$APP_PATH/Info.plist"

          required=(CFBundleIdentifier CFBundleExecutable CFBundleName CFBundlePackageType CFBundleShortVersionString CFBundleVersion)
          for key in "${required[@]}"; do
            value="$(/usr/libexec/PlistBuddy -c "Print :$key" "$APP_PATH/Info.plist")"
            test -n "$value"
            echo "$key=$value"
          done
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundlePackageType' "$APP_PATH/Info.plist")" = 'APPL'
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP_PATH/Info.plist")" = '3.2.0'
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP_PATH/Info.plist")" = '320'

          EXECUTABLE="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP_PATH/Info.plist")"
          test -f "$APP_PATH/$EXECUTABLE"
          file "$APP_PATH/$EXECUTABLE" | grep -q 'Mach-O 64-bit executable arm64'

          test "$(/usr/libexec/PlistBuddy -c 'Print :UIRequiresFullScreen' "$APP_PATH/Info.plist")" = 'true'
          test "$(/usr/libexec/PlistBuddy -c 'Print :UILaunchScreen:UIColorName' "$APP_PATH/Info.plist")" = 'LaunchBackground'
          if /usr/libexec/PlistBuddy -c 'Print :UILaunchStoryboardName' "$APP_PATH/Info.plist" >/dev/null 2>&1; then
            echo 'Legacy UILaunchStoryboardName unexpectedly reached final app.' >&2
            exit 1
          fi

          for permission in NSMicrophoneUsageDescription NSSpeechRecognitionUsageDescription NSPhotoLibraryUsageDescription NSLocalNetworkUsageDescription; do
            value="$(/usr/libexec/PlistBuddy -c "Print :$permission" "$APP_PATH/Info.plist")"
            test -n "$value"
            echo "$permission=$value"
          done

          echo "app_path=$APP_PATH" >> "$GITHUB_OUTPUT"

      - name: Package standard unsigned IPA
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf Payload Artifacts ipa-check
          mkdir -p Payload Artifacts ipa-check
          cp -R "${{ steps.bundle.outputs.app_path }}" Payload/Castmind.app
          /usr/bin/ditto -c -k --sequesterRsrc --keepParent Payload Artifacts/Castmind-unsigned.ipa
          shasum -a 256 Artifacts/Castmind-unsigned.ipa > Artifacts/Castmind-unsigned.ipa.sha256

      - name: Validate final IPA structure
        shell: bash
        run: |
          set -euxo pipefail
          unzip -t Artifacts/Castmind-unsigned.ipa
          unzip -q Artifacts/Castmind-unsigned.ipa -d ipa-check
          test -d ipa-check/Payload/Castmind.app
          test -f ipa-check/Payload/Castmind.app/Info.plist
          ROOT_ITEMS="$(find ipa-check -mindepth 1 -maxdepth 1 -print | wc -l | xargs)"
          test "$ROOT_ITEMS" = '1'
          APP_COUNT="$(find ipa-check/Payload -maxdepth 1 -type d -name '*.app' | wc -l | xargs)"
          test "$APP_COUNT" = '1'
          EXECUTABLE="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' ipa-check/Payload/Castmind.app/Info.plist)"
          test -f "ipa-check/Payload/Castmind.app/$EXECUTABLE"
          plutil -lint ipa-check/Payload/Castmind.app/Info.plist
          echo '--- IPA CONTENTS ---'
          unzip -l Artifacts/Castmind-unsigned.ipa | head -120

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v6
        with:
          name: Castmind-V3.2.0-unsigned-ipa
          path: |
            Artifacts/Castmind-unsigned.ipa
            Artifacts/Castmind-unsigned.ipa.sha256
          if-no-files-found: error
          retention-days: 14
