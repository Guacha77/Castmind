name: Build unsigned IPA

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Castmind unsigned IPA
    runs-on: macos-26
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: |
          xcodebuild -version
          swift --version
          xcrun simctl list runtimes | sed -n '1,20p'

      - name: Install XcodeGen
        run: |
          brew update
          brew install xcodegen
          xcodegen --version

      - name: Generate Xcode project
        run: |
          xcodegen generate --spec project.yml
          test -d Castmind.xcodeproj

      - name: Resolve Swift packages
        run: |
          xcodebuild -resolvePackageDependencies \
            -project Castmind.xcodeproj \
            -scheme Castmind \
            -clonedSourcePackagesDirPath SourcePackages

      - name: Build Release app for iPhone
        run: |
          set -o pipefail
          xcodebuild build \
            -project Castmind.xcodeproj \
            -scheme Castmind \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            -clonedSourcePackagesDirPath SourcePackages \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            ONLY_ACTIVE_ARCH=NO

      - name: Create unsigned IPA
        run: |
          set -euo pipefail
          APP_PATH="$(find build/DerivedData/Build/Products/Release-iphoneos -maxdepth 2 -name 'Castmind.app' -type d | head -n 1)"
          if [ -z "${APP_PATH}" ]; then
            echo "Castmind.app was not produced"
            exit 1
          fi
          EXECUTABLE="$APP_PATH/Castmind"
          if [ ! -f "$EXECUTABLE" ]; then
            echo "Executable missing at $EXECUTABLE"
            exit 1
          fi
          rm -rf Payload Artifacts
          mkdir -p Payload Artifacts
          cp -R "$APP_PATH" Payload/Castmind.app
          /usr/bin/zip -qry Artifacts/Castmind-unsigned.ipa Payload
          shasum -a 256 Artifacts/Castmind-unsigned.ipa | tee Artifacts/Castmind-unsigned.ipa.sha256
          unzip -l Artifacts/Castmind-unsigned.ipa | grep -q 'Payload/Castmind.app/Castmind'
          unzip -l Artifacts/Castmind-unsigned.ipa | grep -q 'Payload/Castmind.app/'

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Castmind-unsigned-ipa
          path: |
            Artifacts/Castmind-unsigned.ipa
            Artifacts/Castmind-unsigned.ipa.sha256
          if-no-files-found: error
          retention-days: 14
