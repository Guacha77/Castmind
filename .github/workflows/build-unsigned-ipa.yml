name: Build unsigned IPA

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Castmind unsigned IPA
    runs-on: macos-26
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: |
          xcodebuild -version
          swift --version
          xcrun simctl list runtimes | sed -n '1,20p'

      - name: Install XcodeGen
        run: |
          brew update
          brew install xcodegen
          xcodegen --version

      - name: Generate Xcode project
        run: |
          xcodegen generate --spec project.yml
          test -d Castmind.xcodeproj

      - name: Resolve Swift packages
        run: |
          xcodebuild -resolvePackageDependencies \
            -project Castmind.xcodeproj \
            -scheme Castmind \
            -clonedSourcePackagesDirPath SourcePackages

      - name: Build Release app for iPhone
        run: |
          set -o pipefail
          xcodebuild build \
            -project Castmind.xcodeproj \
            -scheme Castmind \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            -clonedSourcePackagesDirPath SourcePackages \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            ONLY_ACTIVE_ARCH=NO

      - name: Create unsigned IPA
        run: |
          set -euo pipefail
          APP_PATH="$(find build/DerivedData/Build/Products/Release-iphoneos -maxdepth 2 -name 'Castmind.app' -type d | head -n 1)"
          if [ -z "${APP_PATH}" ]; then
            echo "Castmind.app was not produced"
            exit 1
          fi

          echo "Built app bundle: $APP_PATH"
          plutil -lint "$APP_PATH/Info.plist"
          plutil -p "$APP_PATH/Info.plist"

          read_plist_key() {
            /usr/libexec/PlistBuddy -c "Print :$1" "$APP_PATH/Info.plist"
          }

          for key in CFBundleIdentifier CFBundleExecutable CFBundleName CFBundlePackageType CFBundleShortVersionString CFBundleVersion; do
            value="$(read_plist_key "$key")"
            if [ -z "$value" ]; then
              echo "Missing or empty Info.plist key: $key"
              exit 1
            fi
            echo "$key=$value"
          done

          PACKAGE_TYPE="$(read_plist_key CFBundlePackageType)"
          if [ "$PACKAGE_TYPE" != "APPL" ]; then
            echo "CFBundlePackageType must be APPL, got: $PACKAGE_TYPE"
            exit 1
          fi

          BUNDLE_EXECUTABLE="$(read_plist_key CFBundleExecutable)"
          EXECUTABLE="$APP_PATH/$BUNDLE_EXECUTABLE"
          if [ ! -f "$EXECUTABLE" ]; then
            echo "Executable missing at $EXECUTABLE"
            exit 1
          fi

          rm -rf Payload Artifacts ipa-check
          mkdir -p Payload Artifacts ipa-check
          cp -R "$APP_PATH" Payload/Castmind.app
          /usr/bin/zip -qry Artifacts/Castmind-unsigned.ipa Payload
          shasum -a 256 Artifacts/Castmind-unsigned.ipa | tee Artifacts/Castmind-unsigned.ipa.sha256

          unzip -t Artifacts/Castmind-unsigned.ipa
          unzip -l Artifacts/Castmind-unsigned.ipa | head -100
          unzip -q Artifacts/Castmind-unsigned.ipa -d ipa-check

          test -d ipa-check/Payload/Castmind.app
          test -f ipa-check/Payload/Castmind.app/Info.plist
          test -f "ipa-check/Payload/Castmind.app/$BUNDLE_EXECUTABLE"

          APP_COUNT="$(find ipa-check/Payload -maxdepth 1 -name '*.app' -type d | wc -l | tr -d ' ')"
          if [ "$APP_COUNT" != "1" ]; then
            echo "Expected exactly one .app inside Payload, found: $APP_COUNT"
            find ipa-check/Payload -maxdepth 1 -name '*.app' -type d
            exit 1
          fi

          TOP_LEVEL_COUNT="$(find ipa-check -mindepth 1 -maxdepth 1 | wc -l | tr -d ' ')"
          if [ "$TOP_LEVEL_COUNT" != "1" ] || [ ! -d ipa-check/Payload ]; then
            echo "IPA root must contain only Payload/"
            find ipa-check -mindepth 1 -maxdepth 1
            exit 1
          fi

          plutil -lint ipa-check/Payload/Castmind.app/Info.plist
          plutil -p ipa-check/Payload/Castmind.app/Info.plist

          for key in CFBundleIdentifier CFBundleExecutable CFBundleName CFBundlePackageType CFBundleShortVersionString CFBundleVersion; do
            value="$(/usr/libexec/PlistBuddy -c "Print :$key" ipa-check/Payload/Castmind.app/Info.plist)"
            if [ -z "$value" ]; then
              echo "Missing or empty extracted Info.plist key: $key"
              exit 1
            fi
          done

          EXTRACTED_PACKAGE_TYPE="$(/usr/libexec/PlistBuddy -c 'Print :CFBundlePackageType' ipa-check/Payload/Castmind.app/Info.plist)"
          if [ "$EXTRACTED_PACKAGE_TYPE" != "APPL" ]; then
            echo "Extracted CFBundlePackageType must be APPL, got: $EXTRACTED_PACKAGE_TYPE"
            exit 1
          fi

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Castmind-unsigned-ipa
          path: |
            Artifacts/Castmind-unsigned.ipa
            Artifacts/Castmind-unsigned.ipa.sha256
          if-no-files-found: error
          retention-days: 14
